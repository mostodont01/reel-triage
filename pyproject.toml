[project]
name = "reel-triage"
version = "0.1.0"
description = "Sort saved Instagram reels with Claude: quick sort, deep review, a feed to browse the verdicts."
readme = "README.md"
authors = [
    { name = "mostodont01", email = "otoskypala0@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "imageio-ffmpeg>=0.8.1",
    "pyside6>=6.8",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
reel-triage = "reel_triage:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-qt>=4.4",
]
