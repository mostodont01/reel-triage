<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel Triage</title>
<style>
:root {
  --bg: #f4f3ef; --panel: #ffffff; --ink: #1c1b19; --muted: #6d6a63; --line: #e2dfd7;
  --chip: #ebe8e0; --accent: #3b5bdb;
  --try: #1f8a4c; --keep: #3b5bdb; --maybe: #b7791f; --skip: #9b9890; --fail: #c0392b;
  --code: #f0eee8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141412; --panel: #1d1d1a; --ink: #ecebe6; --muted: #9c998f; --line: #2e2d29;
    --chip: #2a2925; --accent: #7c96ff;
    --try: #43c07a; --keep: #7c96ff; --maybe: #e0a84a; --skip: #77746c; --fail: #e8705f;
    --code: #262622;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--line); padding: 12px 16px; }
.top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; max-width: 1100px; margin: 0 auto; }
h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
.counts { color: var(--muted); font-size: 13px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; max-width: 1100px; margin: 10px auto 0; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
select, input[type=search] { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
input[type=search] { min-width: 180px; flex: 1; max-width: 280px; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
.card { display: grid; grid-template-columns: 300px 1fr; gap: 20px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.card.dim { opacity: .55; }
.card.text { grid-template-columns: 1fr; padding: 12px 16px; }
.card.text h2 { font-size: 16px; }
.badge.quick { opacity: .75; }
.b-check { background: var(--accent); }
.cat.coll { background: transparent; border: 1px dashed var(--line); }
.more { justify-self: center; padding: 10px 24px; }
.media { position: relative; }
.media video, .media img { width: 100%; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 10px;
  background: #000; display: block; }
.frames { display: flex; gap: 4px; margin-top: 6px; }
.frames img { width: 20%; aspect-ratio: 9/16; object-fit: cover; border-radius: 4px; cursor: zoom-in; }
.body { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.badge { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
  color: #fff; border-radius: 6px; padding: 2px 8px; }
.b-try { background: var(--try); } .b-keep { background: var(--keep); }
.b-maybe { background: var(--maybe); } .b-skip { background: var(--skip); }
.b-wait { background: var(--chip); color: var(--muted); } .b-fail { background: var(--fail); }
.cat { font-size: 12px; color: var(--muted); background: var(--chip); border-radius: 6px; padding: 2px 8px; }
.stars { color: var(--maybe); letter-spacing: 1px; font-size: 13px; }
h2 { font-size: 18px; margin: 0; line-height: 1.3; }
.comment { font-size: 15.5px; margin: 0; }
.meta { font-size: 13px; color: var(--muted); }
.meta a { color: inherit; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
details p, details pre { font-size: 13px; color: var(--muted); white-space: pre-wrap; margin: 6px 0 0; }
.tool { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13.5px;
  display: grid; gap: 4px; }
.tool a { color: var(--accent); word-break: break-all; }
.flags { display: flex; gap: 6px; flex-wrap: wrap; }
.flag { font-size: 12px; border-radius: 6px; padding: 1px 7px; background: var(--chip); }
.flag.warn { color: var(--fail); }
.action { display: flex; gap: 8px; align-items: stretch; }
.action code { flex: 1; background: var(--code); border-radius: 8px; padding: 8px 10px; font-size: 13px;
  overflow-x: auto; white-space: nowrap; font-family: ui-monospace, "JetBrains Mono", monospace; }
.btn { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel);
  color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.picks { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }
.projects { display: flex; gap: 6px; flex-wrap: wrap; }
.projects span { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; }
.empty { text-align: center; color: var(--muted); padding: 60px 0; }
#zoom { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center;
  justify-content: center; z-index: 10; cursor: zoom-out; }
#zoom img { max-height: 92vh; max-width: 92vw; border-radius: 8px; }
@media (max-width: 720px) {
  .card { grid-template-columns: 1fr; }
  .media { max-width: 320px; margin: 0 auto; width: 100%; }
}
</style>
</head>
<body>
<header>
  <div class="top"><h1>Reel Triage</h1><span class="counts" id="counts"></span></div>
  <div class="filters" id="filters">
    <span id="verdicts"></span>
    <select id="category"><option value="">All categories</option></select>
    <select id="pick">
      <option value="">Any status</option>
      <option value="none">Undecided</option>
      <option value="want">To implement</option>
      <option value="tried">Tried</option>
      <option value="dismissed">Dismissed</option>
    </select>
    <select id="sort">
      <option value="best">Best first</option>
      <option value="new">Newest saved</option>
    </select>
    <input type="search" id="q" placeholder="Search…">
  </div>
</header>
<main id="feed"><p class="empty">Loading…</p></main>
<div id="zoom"><img alt=""></div>
<script>
const VERDICTS = [["", "All"], ["try", "Try"], ["keep", "Keep"], ["maybe", "Maybe"], ["check", "To check"], ["skip", "Skip"]];
const ORDER = { try: 0, keep: 1, maybe: 2, check: 3, wait: 4, fail: 5, skip: 6 };
const LABEL = { try: "Try", keep: "Keep", maybe: "Maybe", skip: "Skip", check: "To check", wait: "Not sorted", fail: "Failed" };
const PAGE = 60;
let shown = PAGE;
const PICK_LABEL = { want: "Implement", tried: "Tried", dismissed: "Dismiss" };
let reels = [];
const state = load() || { verdict: "", category: "", pick: "", sort: "best", q: "" };

function load() { try { return JSON.parse(localStorage.getItem("rt-filters")); } catch { return null; } }
function save() { try { localStorage.setItem("rt-filters", JSON.stringify(state)); } catch {} }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function media(r, f) { return `/media/${r.id}/${f}`; }
function vkey(r) {
  if (r.verdict) return r.verdict.verdict;
  if (r.status === "failed") return "fail";
  if (r.quick) return { deep: "check", keep: "keep", skip: "skip" }[r.quick.verdict];
  return "wait";
}
function cat(r) { return r.verdict?.category || r.quick?.category || ""; }
function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : null; }

function matches(r) {
  const v = vkey(r);
  if (state.verdict && !(state.verdict === "check" ? ["check", "wait", "fail"].includes(v) : v === state.verdict)) return false;
  if (state.category && cat(r) !== state.category) return false;
  if (state.pick === "none" ? r.pick : (state.pick && r.pick !== state.pick)) return false;
  if (state.q) {
    const hay = [r.author, r.author_id, r.caption, r.verdict?.title, r.verdict?.comment, r.verdict?.summary,
      r.verdict?.tool?.name, (r.verdict?.projects || []).join(" "), r.quick?.title, r.quick?.note,
      (r.collections || []).join(" ")].join(" ").toLowerCase();
    if (!hay.includes(state.q.toLowerCase())) return false;
  }
  return true;
}

function sorted(list) {
  const t = r => r.saved_at || r.added || 0;
  return list.slice().sort(state.sort === "new" ? (a, b) => t(b) - t(a) : (a, b) => {
    const oa = ORDER[vkey(a)] ?? 9, ob = ORDER[vkey(b)] ?? 9;
    return oa - ob || (b.verdict ? 1 : 0) - (a.verdict ? 1 : 0)
      || (b.verdict?.quality || 0) - (a.verdict?.quality || 0) || t(b) - t(a);
  });
}

function card(r) {
  const v = r.verdict, k = vkey(r);
  const poster = r.poster ? media(r, r.poster) : (r.frames?.[0] ? media(r, r.frames[0]) : "");
  const hasMedia = !!(r.video || poster);
  const vid = r.video
    ? `<video controls preload="none" playsinline ${poster ? `poster="${poster}"` : ""} src="${media(r, r.video)}"></video>`
    : (poster ? `<img src="${poster}" alt="">` : "");
  const frames = (r.frames || []).map(f => `<img src="${media(r, f)}" alt="" loading="lazy" data-zoom>`).join("");
  const q = !v && r.quick;
  let body = `<div class="head"><span class="badge b-${k}${q ? " quick" : ""}">${LABEL[k]}</span>`;
  if (cat(r)) body += `<span class="cat">${esc(cat(r))}</span>`;
  if (v) body += `<span class="stars" title="quality ${v.quality}/5">${"★".repeat(v.quality)}${"☆".repeat(5 - v.quality)}</span>`;
  for (const c of r.collections || []) body += `<span class="cat coll" title="your collection">${esc(c)}</span>`;
  body += `</div>`;
  body += `<h2>${esc(v?.title || r.quick?.title || (r.caption || r.id).split("\n")[0].slice(0, 90))}</h2>`;
  if (v) {
    body += `<p class="comment">${esc(v.comment)}</p>`;
    const t = v.tool;
    if (t && t.name) {
      const flags = [];
      if (t.stars) flags.push(`<span class="flag">★ ${esc(t.stars)}</span>`);
      if (t.last_update) flags.push(`<span class="flag">updated ${esc(t.last_update)}</span>`);
      if (t.already_have) flags.push(`<span class="flag">you have it</span>`);
      if (t.built_in) flags.push(`<span class="flag">built in</span>`);
      const url = safeUrl(t.url);
      body += `<div class="tool"><strong>${esc(t.name)}</strong>${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a>` : ""}`
        + (flags.length ? `<div class="flags">${flags.join("")}</div>` : "")
        + (t.safety ? `<div class="flag warn">⚠ ${esc(t.safety)}</div>` : "") + `</div>`;
    }
    if (v.action) body += `<div class="action"><code>${esc(v.action)}</code><button class="btn" data-copy="${esc(v.action)}">Copy</button></div>`;
    if (v.projects?.length) body += `<div class="projects">${v.projects.map(p => `<span>${esc(p)}</span>`).join("")}</div>`;
    body += `<details><summary>What the reel says</summary><p>${esc(v.summary)}</p></details>`;
  } else if (q) {
    body += `<p class="comment">${esc(r.quick.note)}</p><p class="meta">Sorted from the caption only${r.quick.verdict === "deep" ? "; a full review (video, transcript, web check) is next." : "."}</p>`;
    if (r.status === "failed") body += `<p class="meta">Download failed: ${esc(r.error)}</p>`;
  } else if (r.status === "failed") {
    body += `<p class="meta">Download failed: ${esc(r.error)}</p>`;
  } else {
    body += `<p class="meta">${r.status === "fetched" ? "Downloaded, waiting for Claude's review." : "Queued: not downloaded yet."}</p>`;
  }
  if (r.caption) body += `<details><summary>Caption</summary><pre>${esc(r.caption)}</pre></details>`;
  const links = (v?.links || []).map(safeUrl).filter(Boolean);
  if (links.length) body += `<details><summary>Links (${links.length})</summary><p>${links.map(l => `<a href="${esc(l)}" target="_blank" rel="noopener">${esc(l)}</a>`).join("<br>")}</p></details>`;
  body += `<div class="meta">${esc(r.author || r.author_id || "")}${r.posted ? ` · ${r.posted.slice(0,4)}-${r.posted.slice(4,6)}-${r.posted.slice(6)}` : ""} · <a href="${esc(r.url)}" target="_blank" rel="noopener">open on Instagram</a></div>`;
  body += `<div class="picks">${Object.entries(PICK_LABEL).map(([p, l]) =>
    `<button class="btn${r.pick === p ? " on" : ""}" data-pick="${p}" data-id="${r.id}">${l}</button>`).join("")}</div>`;
  const dim = r.pick === "dismissed" || r.pick === "tried";
  const mediaHtml = hasMedia ? `<div class="media">${vid}${frames ? `<div class="frames">${frames}</div>` : ""}</div>` : "";
  return `<article class="card${dim ? " dim" : ""}${hasMedia ? "" : " text"}" id="r-${r.id}">${mediaHtml}<div class="body">${body}</div></article>`;
}

function render() {
  const list = sorted(reels.filter(matches));
  document.getElementById("feed").innerHTML = list.length
    ? list.slice(0, shown).map(card).join("")
      + (list.length > shown ? `<button class="btn more" id="more">Show more (${list.length - shown} left)</button>` : "")
    : `<p class="empty">${reels.length ? "Nothing matches these filters." : "No reels yet. Run <code>reel-triage add &lt;link&gt;</code>."}</p>`;
  const c = { try: 0, keep: 0, maybe: 0, skip: 0, check: 0, wait: 0, fail: 0 };
  reels.forEach(r => c[vkey(r)]++);
  const want = reels.filter(r => r.pick === "want").length;
  document.getElementById("counts").textContent =
    `${reels.length} reels · ${c.try} try · ${c.keep} keep · ${c.maybe} maybe · ${c.check + c.wait + c.fail} to check · ${c.skip} skip · ${want} to implement · ${list.length} match`;
}

function buildFilters() {
  document.getElementById("verdicts").innerHTML = VERDICTS.map(([k, l]) =>
    `<button class="chip" data-verdict="${k}" aria-pressed="${state.verdict === k}">${l}</button>`).join(" ");
  const cats = [...new Set(reels.map(cat).filter(Boolean))].sort();
  const sel = document.getElementById("category");
  sel.innerHTML = `<option value="">All categories</option>` + cats.map(c => `<option>${esc(c)}</option>`).join("");
  sel.value = state.category;
  document.getElementById("pick").value = state.pick;
  document.getElementById("sort").value = state.sort;
  document.getElementById("q").value = state.q;
}

document.addEventListener("click", async e => {
  const t = e.target;
  if (t.id === "more") {
    shown += PAGE; const y = scrollY; render(); scrollTo(0, y);
  } else if (t.dataset.verdict !== undefined) {
    state.verdict = t.dataset.verdict; save(); shown = PAGE;
    document.querySelectorAll("[data-verdict]").forEach(b => b.setAttribute("aria-pressed", b === t));
    render();
  } else if (t.dataset.copy !== undefined) {
    try { await navigator.clipboard.writeText(t.dataset.copy); t.textContent = "Copied"; }
    catch { t.textContent = "Select it"; }
    setTimeout(() => (t.textContent = "Copy"), 1200);
  } else if (t.dataset.pick) {
    const r = reels.find(x => x.id === t.dataset.id);
    const pick = r.pick === t.dataset.pick ? null : t.dataset.pick;
    const res = await fetch("/api/pick", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: r.id, pick }) });
    if (res.ok) { r.pick = pick; render_keep_scroll(); }
  } else if (t.dataset.zoom !== undefined) {
    const z = document.getElementById("zoom"); z.querySelector("img").src = t.src; z.style.display = "flex";
  } else if (t.closest("#zoom")) {
    document.getElementById("zoom").style.display = "none";
  }
});
function render_keep_scroll() { const y = scrollY; render(); scrollTo(0, y); }
document.addEventListener("play", e => {
  document.querySelectorAll("video").forEach(v => { if (v !== e.target) v.pause(); });
}, true);
for (const id of ["category", "pick", "sort"]) {
  document.getElementById(id).addEventListener("change", e => { state[id] = e.target.value; save(); shown = PAGE; render(); });
}
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; save(); shown = PAGE; render(); });

fetch("/api/reels").then(r => r.json()).then(data => { reels = data; buildFilters(); render(); })
  .catch(() => { document.getElementById("feed").innerHTML = `<p class="empty">Can't reach the reel-triage server.</p>`; });
</script>
</body>
</html>
