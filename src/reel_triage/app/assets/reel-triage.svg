<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Reel Triage app icon, in VL's style (like School Notes): a stack of saved
     reels comes in and is sorted into try / maybe / skip. -->
<svg
   width="256"
   height="256"
   viewBox="0 0 256 256"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2c52" />
      <stop offset="1" stop-color="#0f1a30" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ab8ff" />
      <stop offset="1" stop-color="#5f95f5" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="56" fill="url(#background)" />

  <!-- The pile of saved reels behind -->
  <rect x="50" y="52" width="84" height="148" rx="16" fill="none"
        stroke="#72a7ff" stroke-width="7" opacity="0.3" transform="rotate(-9 92 126)" />

  <!-- The reel in front: a phone-shaped frame with a play button -->
  <rect x="44" y="50" width="88" height="156" rx="18" fill="#72a7ff" fill-opacity="0.12" />
  <rect x="44" y="50" width="88" height="156" rx="18" fill="none"
        stroke="#72a7ff" stroke-width="8" />
  <path d="M 76,104 L 112,128 L 76,152 Z" fill="url(#accent)" stroke="url(#accent)"
        stroke-width="6" stroke-linejoin="round" />

  <!-- Sorted: try, maybe, skip -->
  <g stroke-linecap="round" fill="none" stroke-width="8">
    <path d="M 150,88 H 214" stroke="#e8eef8" />
    <path d="M 150,128 H 200" stroke="#e8eef8" opacity="0.6" />
    <path d="M 150,168 H 186" stroke="#e8eef8" opacity="0.3" />
  </g>
  <circle cx="226" cy="88" r="7" fill="#6fcf97" />
  <circle cx="212" cy="128" r="7" fill="#e5b567" />
  <circle cx="198" cy="168" r="7" fill="#f28b82" opacity="0.8" />
</svg>
